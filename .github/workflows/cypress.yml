name: Testes E2E (Cypress)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Executar testes no Chrome (headless)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e executar os testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar relatório Mochawesome como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: cypress/reports
          retention-days: 30

      - name: Publicar screenshots de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-falhas
          path: cypress/screenshots
          retention-days: 30

      - name: Preparar relatório para o GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/reports

  publicar-relatorio:
    name: Publicar relatório no GitHub Pages
    needs: testes
    if: always() && github.ref == 'refs/heads/main' && needs.testes.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
